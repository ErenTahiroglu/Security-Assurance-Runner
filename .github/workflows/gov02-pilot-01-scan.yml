name: GOV-02 PILOT-01 one-shot synthetic Gitleaks scan
on:
  push:
    branches: [development]
    paths:
      - 'docs/gov-02/PILOT_01_ONE_SHOT.marker'
permissions:
  contents: read
concurrency:
  group: sar-gov02-pilot-01-scan
  cancel-in-progress: false
jobs:
  inert-one-shot-linux:
    if: github.repository == 'ErenTahiroglu/Security-Assurance-Runner' && github.ref == 'refs/heads/development' && github.event_name == 'push' && github.event.head_commit.message == 'SAR-PILOT-01-AUTHORIZED-ONCE' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify immutable one-shot commit chain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD~2)" = 'c8366b1b58e36aa8d7c1026884e5060f0093d83b'
          test "$(git log -1 --format=%s HEAD^)" = 'SAR-PILOT-01-ARM'
          test "$(git log -1 --format=%s)" = 'SAR-PILOT-01-AUTHORIZED-ONCE'
          test "$(git diff --name-only HEAD^ HEAD)" = 'docs/gov-02/PILOT_01_ONE_SHOT.marker'
          test "$(cat docs/gov-02/PILOT_01_ONE_SHOT.marker)" = "$(git rev-parse HEAD^)"
          echo PILOT_ONESHOT_COMMIT_CHAIN_VERIFIED
      - name: Validate Bash and synthetic report-inspector tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/gov02/pilot01/preflight.sh
          bash -n scripts/gov02/pilot01/scan_once.sh
          python3 -m unittest discover -s scripts/gov02/pilot01 -p 'test_*.py' -q
      - name: Execute exactly one synthetic Gitleaks scan, after Linux isolation preflight
        shell: bash
        env:
          GOV02_PILOT_ONCE_AUTHORIZED: EXPLICIT_ONESHOT
        run: bash scripts/gov02/pilot01/scan_once.sh
